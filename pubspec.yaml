name: paywallet_lite
description: "PayWalletLite – Secure mobile & offline payments by Paylogic"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  dio: ^5.4.0
  sqflite: ^2.3.0
  sqlcipher_flutter_libs: ^0.5.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.0
  json_annotation: ^4.8.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
